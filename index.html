<!doctype html>
<html lang="ur"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090909"><title>MUZAMIL STYLE GALLERY</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090909;color:#f6f0df;font-family:Arial,sans-serif}header{padding:25px 18px;background:linear-gradient(120deg,#17120a,#050505);border-bottom:1px solid #8c6b27}h1{color:#e8bd58;margin:0;font-size:25px}.wrap{max-width:950px;margin:auto;padding:18px}.sub{color:#b9ad91;margin:8px 0 0}.notice{border:1px solid #72551f;padding:12px;border-radius:12px;color:#d8cba9;font-size:13px;line-height:1.7}.tools{display:flex;gap:9px;margin:18px 0;flex-wrap:wrap}input,select{background:#171717;color:#fff;border:1px solid #554522;border-radius:9px;padding:12px;min-width:0;flex:1}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.item{background:#151515;border:1px solid #3f321b;border-radius:13px;padding:14px;min-height:145px}.art{font-size:42px;text-align:center;padding:12px}.item h3{font-size:15px;margin:6px 0;color:#f1cf78}.item p{font-size:12px;color:#aaa;margin:4px 0 10px}.item button{background:#b68a35;color:#090909;border:0;padding:8px 11px;border-radius:8px;font-weight:bold}.empty{color:#aaa;text-align:center;padding:30px}footer{text-align:center;color:#82775e;font-size:12px;padding:25px}
</style></head><body><header><div class="wrap"><h1>MUZAMIL STYLE GALLERY</h1><p class="sub">Fan-made cosmetic concept collection</p></div></header><main class="wrap">
<div class="notice">یہ ایک آزاد فین میڈ گیلری ہے۔ یہ PUBG یا KRAFTON کی آفیشل ایپ نہیں، اور PUBG اکاؤنٹ یا گیم میں کوئی آئٹم اَن لاک یا تبدیل نہیں کرتی۔</div>
<div class="tools"><input id="search" placeholder="آئٹم تلاش کریں..."><select id="category"><option value="all">تمام اقسام</option><option value="Outfit">Outfits</option><option value="Gear">Gear</option><option value="Vehicle">Vehicles</option></select></div><div class="grid" id="grid"></div><footer>MUZAMIL STYLE GALLERY · Independent fan-made concepts</footer></main>
<script>
const items=[["Frost Commander","Outfit","🧥","Snow outfit"],["Golden Ranger","Outfit","🥋","Gold outfit"],["Shadow Scout","Outfit","🥷","Dark outfit"],["Desert Nomad","Outfit","🧣","Desert outfit"],["Arctic Guard","Outfit","❄️","Winter outfit"],["Neon Pilot","Outfit","🧑‍🚀","Pilot outfit"],["Frost Backpack","Gear","🎒","Winter backpack"],["Golden Pack","Gear","🎒","Gold backpack"],["Tactical Helmet","Gear","🪖","Helmet concept"],["Shield Vest","Gear","🦺","Vest concept"],["Supply Case","Gear","📦","Supply crate"],["Recon Goggles","Gear","🥽","Goggles"],["Snow Runner","Vehicle","🚙","Snow vehicle"],["Gold Cruiser","Vehicle","🚗","Gold car"],["Desert Buggy","Vehicle","🏎️","Desert buggy"],["Arctic Bike","Vehicle","🏍️","Winter bike"],["Neon Coupe","Vehicle","🚘","Neon car"],["Trail Truck","Vehicle","🚚","Off-road truck"]];
const grid=document.getElementById('grid'),search=document.getElementById('search'),category=document.getElementById('category');
function saveItem(n){let a=JSON.parse(localStorage.getItem('muzamil-favs')||'[]');if(!a.includes(n))a.push(n);localStorage.setItem('muzamil-favs',JSON.stringify(a));alert('پسندیدہ میں شامل ہوگیا: '+n)}
function render(){let q=search.value.toLowerCase(),c=category.value;let found=items.filter(x=>(c==='all'||x[1]===c)&&(x[0]+' '+x[3]).toLowerCase().includes(q));grid.innerHTML=found.length?found.map(x=>`<article class="item"><div class="art">${x[2]}</div><h3>${x[0]}</h3><p>${x[1]} · ${x[3]}</p><button type="button" data-name="${x[0]}">☆ پسندیدہ</button></article>`).join(''):'<div class="empty">کوئی آئٹم نہیں ملا</div>';grid.querySelectorAll('button[data-name]').forEach(b=>b.addEventListener('click',()=>saveItem(b.dataset.name)))}
search.addEventListener('input',render);category.addEventListener('change',render);render();
</script></body></html>
