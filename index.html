<!doctype html>
<html lang="ur">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101820">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
<title>MUZAMIL BATTLEGROUND 3D</title>
</head>
<body>
<div id="loading">MUZAMIL BATTLEGROUND 3D<br><small>3D دنیا تیار ہو رہی ہے…</small></div>
<div id="hud">
  <div class="top"><strong>MUZAMIL BATTLEGROUND</strong><span id="status">برفانی میدان</span></div>
  <div class="stats"><span>❤️ <b id="health">100</b></span><span>🔫 <b id="ammo">30</b></span><span>🎯 <b id="kills">0</b></span></div>
  <div id="message">میدان میں خوش آمدید</div>
</div>
<div id="menu" class="panel">
  <h1>MUZAMIL BATTLEGROUND</h1>
  <p>اصل 3D ایکشن پروٹوٹائپ — تمام دکھائے گئے سوٹس اور گن اسکنز مفت</p>
  <label>کردار کا سوٹ</label>
  <select id="outfit"><option value="fire">Fire</option><option value="snow">Snow</option><option value="forest">Forest</option><option value="shadow">Shadow</option></select>
  <label>گن اسکن</label>
  <select id="weaponSkin"><option value="gold">Gold</option><option value="ice">Ice</option><option value="red">Red</option><option value="black">Black</option></select>
  <label>گرافکس</label>
  <select id="quality"><option value="high">High</option><option value="low">Low (کمزور موبائل کے لیے)</option></select>
  <button id="start">گیم شروع کریں</button>
  <small>یہ پہلا قابلِ کھیل 3D سنگل پلیئر ورژن ہے۔ آن لائن ملٹی پلیئر ابھی شامل نہیں۔</small>
</div>
<div id="controls" class="hidden">
  <div id="stick"><div id="nub"></div></div>
  <div class="rightControls"><button id="jump">کودیں</button><button id="fire">فائر</button><button id="reload">ری لوڈ</button></div>
  <button id="back">مینو</button>
</div>
<script type="module" src="game.js"></script>
</body></html>
